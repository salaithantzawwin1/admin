# =============================================================
# AMS — Testing environment overrides (Testing Server)
# Usage: docker compose -f compose.yaml -f compose.test.yaml --env-file .env.test up -d --build
# =============================================================
services:
  backend:
    environment:
      APP_ENV: testing

  # Frontend port comes from the base compose.yaml ("80:80") — the plain
  # URL http://192.168.100.110/ is the one and only AMS address. The old
  # :8080 legacy mapping was removed (2026-09-24): update old bookmarks.
