name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck + suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend
      - name: Run check suites
        run: npm test
        working-directory: backend

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  # The ONE status check to require in branch protection: it needs both jobs,
  # so a single red job (or a skipped one) blocks the merge. Requiring the two
  # jobs individually instead would let a skipped job slip through as "passing".
  # Setup: docs/CI_BRANCH_PROTECTION.md
  gate:
    name: CI gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }} # still run (red) when a needed job failed
    steps:
      - name: Fail when any required job did not succeed
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.frontend.result }}" = "success" ]
