# =============================================================
# AMS — Production environment overrides (Real Production Server)
# Usage: docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.prod up -d
#
# Runs on the SAME host as the testing stack (192.168.100.110):
#   - project name ams-prod → own network + ams-prod_* volumes (no clash with testing)
#   - frontend UI on :3080 (testing keeps :80)
#   - backend loopback on :3010 (testing keeps :3000)
# =============================================================
name: ams-prod

services:
  backend:
    # base maps backend on 127.0.0.1:3000 — remap to 3010 here so testing's
    # backend keeps :3000 and both stacks can run side by side.
    ports: !override
      - "127.0.0.1:3010:3000"
    environment:
      APP_ENV: production
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD required — sysadmin initial password}

  frontend:
    # Production serves the UI on :3080 — separate from testing (:80).
    ports: !override
      - "3080:80"
