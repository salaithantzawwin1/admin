# =============================================================
# AMS — PRODUCTION overrides (project: ams)
# Designation (2026-09-25): PRODUCTION lives on the plain URL
#   http://192.168.100.110/  (:80) — this is the stack with the
#   real data. TESTING moved to :8030 (compose.test.yaml).
# Usage: docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.prod up -d --build
# =============================================================
services:
  backend:
    environment:
      APP_ENV: production
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD required — sysadmin initial password}

  # Frontend port comes from the base compose.yaml ("80:80") — the plain
  # URL http://192.168.100.110/ is the PRODUCTION AMS address.
  # Testing runs on :8030 from the same checkout (compose.test.yaml).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ENV_LABEL: Production
