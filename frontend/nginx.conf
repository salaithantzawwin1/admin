server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API reverse proxy → backend container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — index.html must never be cached: it references the
    # hashed asset bundle, and a stale copy keeps loading the OLD app
    # (the "new deploy but nothing changed" bug).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # nginx does not inherit add_header from the server block into a
        # location that declares its own, and try_files serves every SPA route
        # through this location — so the security headers are repeated here or
        # the app shell would ship without a CSP.
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets (hashed filenames — safe to cache long)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # same inheritance rule as above: the hashed JS/CSS must still be
        # nosniff and script-src-safe even though this location adds a header
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    # security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    # A page is only allowed to load what this app ships: no inline scripts, no
    # third-party origins. Tokens live in localStorage, so a script that gets
    # injected must not be able to run at all.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies none;
}
