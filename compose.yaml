# =============================================================
# AMS — Base Compose (test & prod overrides: compose.test.yaml / compose.prod.yaml)
#
# DESIGNATION (2026-09-25):
#   PRODUCTION  = project "ams"      → UI http://192.168.100.110 (:80)  — the real data
#   TESTING     = project "ams-test" → UI http://192.168.100.110:8030 — disposable
# See docs/DEPLOYMENT.md §1.
# =============================================================
name: ams

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ams}
      POSTGRES_USER: ${POSTGRES_USER:-ams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ams} -d ${POSTGRES_DB:-ams}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-testing}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      # Myanmar time — cron schedules (reminders 07:30, auto-release) run in local time
      TZ: Asia/Yangon
      DATABASE_URL: postgresql://${POSTGRES_USER:-ams}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ams}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      UPLOAD_PATH: /app/uploads
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe#2026}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ENV_LABEL: ${VITE_ENV_LABEL:-Production}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
  uploads_data:
